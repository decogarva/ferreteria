<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferretería - Catálogo</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f5f0; color: #222; }
  header { background: #b33a1e; color: #fff; padding: 18px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 1.5rem; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .filters { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 16px; }
  input, select { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); display: flex; flex-direction: column; }
  .card img { width: 100%; height: 180px; object-fit: contain; background: #eee; }
  .noimg { height: 180px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; }
  .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { font-weight: 600; }
  .desc { font-size: 14px; color: #555; flex: 1; }
  .price { font-size: 18px; font-weight: 700; color: #b33a1e; }
  .stock { font-size: 13px; color: #2e7d32; }
  .stock.out { color: #c62828; }
  .msg { text-align: center; padding: 40px 16px; color: #666; }
  @media (max-width: 500px) { .filters { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>Ferretería Catálogo</h1></header>
<div class="wrap">
  <div class="filters">
    <input id="q" type="search" placeholder="Buscar artículo...">
    <select id="cat"><option value="">Todas las categorías</option></select>
  </div>
  <div id="msg" class="msg">Cargando artículos...</div>
  <div id="grid" class="grid"></div>
</div>

<script>
  // ====== CONFIGURACIÓN ======
  // ID de la planilla: está en la URL, entre /d/ y /edit
  const SHEET_ID = "1vRFh4JZ6WFkq6KDnthksbS8veHEz-_YITd4SlwT6zpcecWT6CCXUo8c9VSOXXmfhfJugLwtKpbguHII";
  // Nombre de la pestaña (hoja) con los artículos
  const SHEET_NAME = "Hoja1";
  // Columnas esperadas en la primera fila:
  // nombre | descripcion | precio | stock | categoria | imagen
  // ===========================

  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
 alert CSV_URL
  const $ = id => document.getElementById(id);
  let items = [];

  // Parser CSV que respeta comillas y comas dentro de celdas
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else quoted = false;
        } else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  const esc = s => String(s).replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

  async function init() {
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = parseCSV(await res.text()).filter(r => r.some(x => x.trim()));
      const headers = rows[0].map(h => h.trim().toLowerCase());
      items = rows.slice(1).map(r =>
        Object.fromEntries(headers.map((h, i) => [h, (r[i] || "").trim()])))
        .filter(it => it.nombre);

      const cats = [...new Set(items.map(it => it.categoria).filter(Boolean))].sort();
      $("cat").insertAdjacentHTML("beforeend",
        cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join(""));

      $("msg").style.display = "none";
      render();
    } catch (e) {
      $("msg").textContent = "No se pudo cargar el catálogo. Revisa que la planilla esté compartida como \"Cualquier persona con el enlace\".";
    }
  }

  function render() {
    const q = $("q").value.toLowerCase();
    const cat = $("cat").value;
    const list = items.filter(it =>
      (!cat || it.categoria === cat) &&
      (!q || (it.nombre + " " + it.descripcion).toLowerCase().includes(q)));

    if (!list.length) {
      $("grid").innerHTML = "";
      $("msg").style.display = "block";
      $("msg").textContent = "No se encontraron artículos.";
      return;
    }
    $("msg").style.display = "none";

    $("grid").innerHTML = list.map(it => {
      const img = /^https?:\/\//.test(it.imagen)
        ? `<img src="${esc(it.imagen)}" alt="${esc(it.nombre)}" loading="lazy"
             onerror="this.outerHTML='<div class=&quot;noimg&quot;>Sin imagen</div>'">`
        : `<div class="noimg">Sin imagen</div>`;
      const hasStock = it.stock !== "" && Number(it.stock) > 0;
      const stockTxt = it.stock === "" ? "" :
        (hasStock ? `En stock: ${esc(it.stock)}` : "Sin stock");
      return `
        <div class="card">
          ${img}
          <div class="body">
            <div class="name">${esc(it.nombre)}</div>
            <div class="desc">${esc(it.descripcion)}</div>
            ${it.precio ? `<div class="price">$${esc(it.precio)}</div>` : ""}
            ${stockTxt ? `<div class="stock ${hasStock ? "" : "out"}">${stockTxt}</div>` : ""}
          </div>
        </div>`;
    }).join("");
  }

  $("q").addEventListener("input", render);
  $("cat").addEventListener("change", render);
  init();
</script>
</body>
</html>
